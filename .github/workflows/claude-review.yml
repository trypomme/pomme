# Claude reviews every pull request and leaves a GitHub review on it:
#   Approve          no blocking problems (smaller notes go in as inline comments)
#   Request changes  something must be fixed before it merges
# A new push to the PR runs the review again. With the main branch ruleset
# (an approval plus passing CI required) and auto-merge on, approved PRs merge
# on their own.
#
# Needs one repository or organization secret: CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`, uses a Claude subscription) or ANTHROPIC_API_KEY.
# And Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests", so the approval below counts.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Drafts aren't reviewed until they're marked ready; fork PRs get no secrets.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, vultr]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: '*'
          classify_inline_comments: 'false'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            You are the only reviewer of this pull request: if you approve it, it merges
            into main by itself once CI passes. Review it as a careful senior engineer.
            The PR branch is checked out in the working directory; read the surrounding
            code, CLAUDE.md, AGENTS.md and openspec/ where they help. See the change with
            `gh pr diff ${{ github.event.pull_request.number }}` and
            `gh pr view ${{ github.event.pull_request.number }}`.

            Blocking (request changes): bugs and regressions, security problems, leaked
            secrets, data loss, broken builds or CI, a change that doesn't do what the
            PR says, missing tests for risky logic.
            Not blocking (approve, and mention as inline comments if worth it): style,
            naming, small refactors, nice-to-haves.
            When unsure whether something is blocking, check it in the code before
            deciding; don't block on speculation.

            Put comments on specific lines with
            mcp__github_inline_comment__create_inline_comment (confirmed: true).
            Don't post other PR comments.

            Finish by writing your verdict to the file `review-verdict.json` in the
            working directory, exactly this shape:
              {"verdict": "approve" | "request_changes",
               "summary": "<markdown: what the PR does, then any blocking issues as a list>"}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"

      # The review itself is posted here, not by Claude, so a PR is never left without
      # a verdict and only these two outcomes are possible.
      - name: Post the review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s review-verdict.json ]; then
            echo "::error::Claude finished without a verdict"; exit 1
          fi
          verdict=$(jq -r .verdict review-verdict.json)
          body="$(jq -r .summary review-verdict.json)"$'\n\n'"_Automated review by Claude_"
          case "$verdict" in
            approve)         gh pr review "$PR" --approve --body "$body" ;;
            request_changes) gh pr review "$PR" --request-changes --body "$body" ;;
            *) echo "::error::unexpected verdict '$verdict'"; exit 1 ;;
          esac
