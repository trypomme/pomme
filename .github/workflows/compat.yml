# Runs well-known open-source iOS apps in pomme and reports what works and what breaks.
#
#   wonderous  gskinner's Wonderous (Flutter, Impeller)      MIT: screenshots may be shown, with credit
#   gallery    Flutter Gallery (Material and Cupertino)      BSD-3: screenshots may be shown, with credit
#   bluesky    Bluesky's social-app (Expo, React Native)     test only: its artwork, icons and marks
#                                                            aren't MIT (see its ASSETS.md); don't publish
#
# Each app is built from a pinned upstream commit (scripts/compat/build.sh) on the Mac runner
# (the Mac mini, or GitHub's Macs if the MACOS_RUNNER variable says so), then run in pomme through a few scenarios (scripts/compat/run.sh). An app crashing or
# reaching an API pomme lacks is a finding, not a failure: the job fails only if an app or pomme
# doesn't build. The run's Summary page has the table; the "compat-<app>" artifacts hold the
# screenshots, logs and coverage reports (JSON).
#
# When it runs: only before a release. build.yml calls it for every v* tag, and the release waits
# for it, so a release can't go out if an app or pomme stops building. It takes over an hour
# (Bluesky alone is ~45 minutes), so it doesn't run on pull requests or on a schedule. To run it
# at any other time, use "Run workflow" on the Actions tab.
name: App compatibility

on:
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to run (JSON list)
        default: '["wonderous", "gallery", "bluesky"]'
  workflow_call:
    inputs:
      apps:
        description: Apps to run (JSON list)
        type: string
        default: '["wonderous", "gallery", "bluesky"]'

# One run at a time per branch; a newer push waits rather than cancelling (Bluesky alone takes
# ~45 minutes to build) and replaces any run still waiting.
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match build.yml: the sysroot cache is shared with it.
  SWIFT_TAG: swift-6.3.2-RELEASE
  FLUTTER_VERSION: 3.47.9

jobs:
  # As in build.yml (same cache key, so whichever runs first builds it).
  sysroot:
    name: Sysroot
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","mac-mini"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh
      - name: Cache sysroot
        id: cache
        uses: actions/cache@v4
        with:
          path: vendor/sysroot
          key: sysroot-${{ env.SWIFT_TAG }}-${{ hashFiles('scripts/build-sysroot.sh', 'scripts/sysroot/**', 'scripts/swiftui/**', 'scripts/combine/**') }}
      - name: Build sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        # Install only what's missing: the Mac mini runner can't write to Homebrew (as in build.yml).
        run: |
          for f in ninja bash cmake; do [ -x "$(brew --prefix)/bin/$f" ] || brew install "$f"; done
          scripts/build-sysroot.sh
      - name: Pack sysroot
        run: tar -czf sysroot.tar.gz -C vendor/sysroot .
      - uses: actions/upload-artifact@v4
        with:
          name: compat-sysroot
          path: sysroot.tar.gz
          retention-days: 3
          compression-level: 0

  pomme:
    name: pomme (macOS)
    needs: sysroot
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","mac-mini"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Build
        run: cargo build --release --locked -p pomme
      - uses: actions/upload-artifact@v4
        with:
          name: compat-pomme
          path: target/release/pomme
          retention-days: 3

  app:
    name: ${{ matrix.app }}
    needs: [sysroot, pomme]
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '["self-hosted","mac-mini"]') }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(inputs.apps || '["wonderous", "gallery", "bluesky"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh
      - uses: subosito/flutter-action@v2
        if: matrix.app != 'bluesky'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        if: matrix.app == 'bluesky'
        with:
          node-version: 24
      # Expo's prebuild runs `pod install`. GitHub's Macs have CocoaPods; install it for this user
      # if the runner doesn't.
      - name: CocoaPods
        if: matrix.app == 'bluesky'
        run: |
          if ! command -v pod >/dev/null; then
            gem install --user-install cocoapods
            echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
          fi
      - name: Build ${{ matrix.app }}
        id: build
        run: |
          set -o pipefail
          scripts/compat/build.sh ${{ matrix.app }} | tee build-out.txt
          echo "app=$(tail -1 build-out.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: compat-sysroot
      - uses: actions/download-artifact@v4
        with:
          name: compat-pomme
          path: bin
      - name: Unpack the sysroot
        run: mkdir -p vendor/sysroot && tar -xzf sysroot.tar.gz -C vendor/sysroot
      # pomme draws Impeller's built-in shaders from MSL that this engine's impellerc makes
      # (scripts/flutter/impeller-msl.sh); without it Flutter can't create its pipelines.
      - name: Impeller shaders
        if: matrix.app != 'bluesky'
        run: |
          ln -sfn "$FLUTTER_ROOT" "vendor/flutter-$FLUTTER_VERSION"
          flutter precache --ios
          scripts/flutter/impeller-msl.sh "$FLUTTER_VERSION"
      - name: Run in pomme
        run: |
          chmod +x bin/pomme
          command -v timeout >/dev/null || command -v gtimeout >/dev/null || brew install coreutils  # timeout
          scripts/compat/run.sh ${{ matrix.app }} "${{ steps.build.outputs.app }}" results/${{ matrix.app }} bin/pomme
      - name: Summary
        if: always()
        run: python3 scripts/compat/summary.py results >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.app }}
          path: results/
          retention-days: 30
