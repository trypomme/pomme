# pomme's tests on GitHub's hosted runners, so nobody has to run them by hand.
#
# - linux: everything that needs no Xcode (the fixture tests skip themselves).
# - macos: the fixture tests, which build tiny iOS apps with Xcode and run them
#   on pomme with the sysroot (scripts/build-sysroot.sh, cached).
# - browser: hello-expo built with Xcode, run in pomme's browser build in
#   headless Chromium and WebKit (scripts/web-test.sh).
#
# macOS minutes cost more than Linux ones, so the macOS jobs run on pull
# requests and pushes to main only, and a new push cancels the older run.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: OpenSpec
        continue-on-error: true # add-localized-resources has a known warning (a long requirement)
        run: npx -y @fission-ai/openspec@2.1.0 validate --all --strict

  macos:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: brew install ninja
      - name: Swift version
        id: swift
        # The sysroot's Swift runtime must be built from the tag of the compiler Xcode ships.
        run: |
          xcodebuild -version
          v=$(xcrun swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p' | head -1)
          echo "tag=swift-$v-RELEASE" >> "$GITHUB_OUTPUT"
      - name: Sysroot cache
        id: sysroot
        uses: actions/cache@v4
        with:
          path: vendor/sysroot
          key: sysroot-${{ steps.swift.outputs.tag }}-${{ hashFiles('scripts/build-sysroot.sh', 'scripts/sysroot/**', 'scripts/combine/**', 'scripts/swiftui/**') }}
      - name: Build the sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: SWIFT_TAG=${{ steps.swift.outputs.tag }} scripts/build-sysroot.sh
      - run: cargo test --workspace

  browser:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          brew install ninja
          cargo install wasm-pack --locked
      - name: Swift version
        id: swift
        run: |
          v=$(xcrun swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9.]+).*/\1/p' | head -1)
          echo "tag=swift-$v-RELEASE" >> "$GITHUB_OUTPUT"
      - name: Sysroot cache
        id: sysroot
        uses: actions/cache@v4
        with:
          path: vendor/sysroot
          key: sysroot-${{ steps.swift.outputs.tag }}-${{ hashFiles('scripts/build-sysroot.sh', 'scripts/sysroot/**', 'scripts/combine/**', 'scripts/swiftui/**') }}
      - name: Build the sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: SWIFT_TAG=${{ steps.swift.outputs.tag }} scripts/build-sysroot.sh
      - name: hello-expo cache
        id: app
        uses: actions/cache@v4
        with:
          path: apps/hello-expo/ios/build/Build/Products/Release-iphoneos/helloexpo.app
          key: hello-expo-${{ hashFiles('apps/hello-expo/**', '!apps/hello-expo/ios/**', 'scripts/build-app.sh') }}
      - name: Build hello-expo
        if: steps.app.outputs.cache-hit != 'true'
        run: scripts/build-app.sh hello-expo device release
      - name: Playwright
        working-directory: web/tests
        run: |
          npm ci
          npx playwright install chromium webkit
      - name: Browser tests (hello-expo)
        # The hello-expo cases of `scripts/web-test.sh all`: taps, two taps while
        # busy, the page without JSPI, the page embedded in another site's, and
        # WebKit without JSPI.
        run: |
          T=scripts/web-test.sh
          $T hello-expo --timeout 240 --see "Tapped 0" --tap 195,265 --see "Tapped 1"
          NO_BUILD=1 $T hello-expo --timeout 240 --see "Tapped 0" --taps "195,265 240,508" --gone "Hello from pomme" --sleep 1500 --tap 38,69 --see "Tapped 1 time"
          NO_BUILD=1 QUERY=nojspi $T hello-expo --wait "needs a browser with JSPI"
          NO_BUILD=1 $T embed --timeout 240 --see "Tapped 0" --tap 195,265 --see "Tapped 1"
          NO_BUILD=1 $T embed --browser webkit --wait "needs a browser with JSPI"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screens
          path: web/tests/out/
          if-no-files-found: ignore
