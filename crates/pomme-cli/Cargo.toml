[package]
name = "pomme"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
plist = "1.10.3"
pomme-cpu = { version = "0.1.0", path = "../pomme-cpu" }
pomme-desktop = { version = "0.1.0", path = "../pomme-desktop" }
pomme-hle = { version = "0.1.0", path = "../pomme-hle" }
pomme-loader = { version = "0.1.0", path = "../pomme-loader" }
pomme-macho = { version = "0.1.0", path = "../pomme-macho" }
serde_json = "1.0.154"
pomme-net = { version = "0.1.0", path = "../pomme-net" }
pomme-webview = { version = "0.1.0", path = "../pomme-webview" }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny-skia = "0.12"
pomme-video = { path = "../pomme-video" }
mp4 = "0.14.0"
