[package]
name = "pomme-webview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Web views' pages in the host's own web view (WebKit on macOS), in a helper process"

[dependencies]
pomme-hle = { version = "0.1.0", path = "../pomme-hle", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
