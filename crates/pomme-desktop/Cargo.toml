[package]
name = "pomme-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pomme in a desktop window: the app on a phone, like the iOS Simulator"

[dependencies]
pomme-hle = { version = "0.1.0", path = "../pomme-hle" }
pomme-video = { version = "0.1.0", path = "../pomme-video" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pollster = "0.4"
tiny-skia = "0.12.0"
wgpu = "30.0.1"
winit = "0.30"
# The app's accessibility tree for the system's screen reader (NSAccessibility, UIA, AT-SPI).
accesskit = "0.25"
accesskit_winit = "0.34"
# The Open URL panel over the phone: egui's drawing parts only, in pomme's own
# window and wgpu surface (versions in step with wgpu, winit and accesskit_winit).
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-wgpu = { version = "0.37", default-features = false }

# Native menus where they don't need GTK (Linux has the keyboard shortcuts only).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21.2", default-features = false }
