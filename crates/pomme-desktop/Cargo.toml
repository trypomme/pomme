[package]
name = "pomme-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pomme in a desktop window: the app on a phone, like the iOS Simulator"

[dependencies]
pomme-hle = { version = "0.1.0", path = "../pomme-hle" }
pomme-video = { version = "0.1.0", path = "../pomme-video" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pollster = "0.4"
tiny-skia = "0.12.0"
wgpu = "30.0.1"
winit = "0.30"

# Native menus where they don't need GTK (Linux has the keyboard shortcuts only).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21.2", default-features = false }
