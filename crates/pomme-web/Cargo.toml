[package]
name = "pomme-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pomme in the browser: the emulator as a WebAssembly worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.107"
pomme-hle = { version = "0.1.0", path = "../pomme-hle" }
pomme-loader = { version = "0.1.0", path = "../pomme-loader" }
wasm-bindgen = "0.2.130"
